services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sophos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sophos_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sophos}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sophos} -d ${POSTGRES_DB:-sophos}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  sophos:
    # 仓库名必须与 GitHub Actions 里 DOCKERHUB_USERNAME 一致；
    # 可用 .env 的 SOPHOS_IMAGE 覆盖（只写到仓库名，不带 tag）。
    image: ${SOPHOS_IMAGE:-baiyuyuyu/sophos}:${SOPHOS_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sophos}:${POSTGRES_PASSWORD:-sophos_dev}@postgres:5432/${POSTGRES_DB:-sophos}
      ONEBOT_WS_URL: ${CONTAINER_ONEBOT_WS_URL:-ws://10.13.186.67:48086}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SOPHOS_PORT:-3215}:8080"
    volumes:
      - ./logs:/app/logs
      - ./plugins:/app/plugins
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    init: true
    restart: unless-stopped
