name: Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本标签（同时推送该版本和最新提交的 sha 标签）"
        required: false
        default: latest
      platforms:
        description: "目标平台（多平台用逗号分隔，例如 linux/amd64,linux/arm64）"
        required: false
        default: linux/amd64

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker Hub token
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::缺少 DOCKERHUB_TOKEN。请在仓库 Settings → Secrets and variables → Actions 中添加 Name=DOCKERHUB_TOKEN 的 secret（Docker Hub Access Token，Read & Write）。"
            exit 1
          fi

      - name: Resolve image repository
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          owner="${DOCKERHUB_USERNAME:-baiyuyuyu}"
          owner="$(echo "$owner" | tr '[:upper:]' '[:lower:]')"
          echo "repo=$owner/sophos" >> "$GITHUB_OUTPUT"
          echo "version=${{ inputs.version || 'latest' }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'baiyuyuyu' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          tags: |
            ${{ steps.image.outputs.repo }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.repo }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
